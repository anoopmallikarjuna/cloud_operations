cloud:
  aws:
    credentials:
      access-key: Add-your-key
      secret-key: Add-your-secret-key
      region: eu-north-1
      stack:
        auto: false

application:
  bucket:
    name: java-a-storage

spring:
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port:8080